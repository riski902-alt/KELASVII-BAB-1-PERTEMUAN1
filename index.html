<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Fun! - Dashboard Pembelajaran Interaktif</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* (CSS Animasi Sebelumnya Tetap Sama) */
        :root {
            --deep-navy: #14243A; --denim-blue: #426A91; --soft-denim: #6489AE;
            --soft-green: #A8C9AE; --off-white: #F4F7FA; --pure-white: #FFFFFF;
            --cyan-accent: #00bcd4; --cyan-light: #e0f7fa; --status-green: #1dd1a1;
            --glow-cyan: rgba(0, 188, 212, 0.4); --glow-green: rgba(29, 209, 161, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--off-white); color: var(--deep-navy); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
        .menu-title, .user-name, .btn-action { font-family: 'Plus Jakarta Sans', sans-serif; }

        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 4%; background: var(--pure-white); border-bottom: 1px solid rgba(0, 0, 0, 0.05); flex-shrink: 0; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 1.8rem; color: var(--denim-blue); transition: transform 0.3s ease; }
        .logo-area:hover .logo-icon { transform: rotate(15deg) scale(1.1); }
        .logo-area h1 { font-size: 1.1rem; font-weight: 700; color: var(--deep-navy); margin-bottom: 2px; }
        .tagline { font-size: 0.7rem; color: var(--soft-denim); }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-info { display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: var(--status-green); border-radius: 50%; box-shadow: 0 0 8px var(--status-green); animation: pulseDot 2s infinite ease-in-out; }
        .btn-profile { background: none; border: none; color: var(--deep-navy); font-size: 1.4rem; cursor: pointer; transition: transform 0.2s ease; }

        .page-title-section { background: var(--deep-navy); margin: 15px 4%; padding: 3vh 32px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(20, 36, 58, 0.15); z-index: 8; flex-shrink: 0; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .page-title-content { display: flex; flex-direction: column; gap: 8px; }
        .page-title-section .badge-jp { align-self: flex-start; background: rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; color: var(--pure-white); font-weight: bold; backdrop-filter: blur(4px); }
        .chapter-title { font-size: 1.6rem; color: var(--pure-white); line-height: 1.2; }
        .meeting-title { font-size: 1rem; color: var(--soft-green); font-weight: 500; }
        .hero-icon { font-size: 4.5rem; color: var(--soft-green); opacity: 0.9; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .nav-container { background: var(--pure-white); padding: 10px 2%; border-bottom: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.02); flex-shrink: 0; z-index: 5; }
        .menu-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
        .menu-row::-webkit-scrollbar { display: none; }

        .tab-button { position: relative; background: var(--pure-white); color: var(--denim-blue); border: 2px solid var(--denim-blue); border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 6px; flex: 1; min-width: fit-content; cursor: pointer; overflow: hidden; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; justify-content: center; user-select: none; }
        .tab-button:hover { background: var(--off-white); transform: translateY(-3px); box-shadow: 0 6px 14px rgba(66, 106, 145, 0.18); }
        .tab-button:active { transform: translateY(1px) scale(0.96); box-shadow: 0 2px 6px rgba(66, 106, 145, 0.12); }
        .menu-icon { font-size: 1.12rem; transition: transform 0.3s ease, color 0.3s ease; }
        .menu-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2px; }
        .status-indicator { margin-left: 4px; font-size: 0.95rem; transition: transform 0.3s ease; }

        .tab-button.status-progress { background: var(--cyan-light); color: var(--deep-navy); border-color: var(--cyan-accent); box-shadow: 0 0 10px var(--glow-cyan); }
        .tab-button.status-progress .menu-icon, .tab-button.status-progress .status-indicator { color: var(--cyan-accent); }
        .tab-button.status-completed { background: var(--soft-green); color: var(--deep-navy); border-color: var(--soft-green); box-shadow: 0 4px 12px var(--glow-green); }
        .tab-button.status-completed .menu-icon, .tab-button.status-completed .status-indicator { color: var(--deep-navy); }

        .ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.6); transform: scale(0); animation: rippleAnim 0.55s linear; pointer-events: none; }

        .main-content-area { flex: 1; padding: 24px 4%; overflow-y: auto; background: var(--off-white); }
        .tab-pane { display: none; max-width: 1400px; margin: 0 auto; }
        .tab-pane.active { display: block; animation: contentSlideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .content-card { background: var(--pure-white); border-radius: 20px; padding: 28px; box-shadow: 0 6px 18px rgba(0,0,0,0.04); border: 1px solid rgba(0, 0, 0, 0.05); margin-bottom: 20px; transition: transform 0.3s ease; }
        .btn-action { position: relative; background: var(--denim-blue); color: var(--pure-white); border: none; padding: 12px 26px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; overflow: hidden; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; box-shadow: 0 4px 12px rgba(66, 106, 145, 0.25); user-select: none; }
        .btn-action:hover { background: var(--deep-navy); transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 16px rgba(20, 36, 58, 0.3); }
        .btn-action.success { background: var(--status-green); color: var(--deep-navy); pointer-events: none; box-shadow: 0 4px 15px var(--glow-green); }

        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
        @keyframes contentSlideUp { from { opacity: 0; transform: translateY(16px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* --- CSS BARU UNTUK MODAL LOGIN --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 36, 58, 0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.3s;
        }
        .modal-box {
            background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: contentSlideUp 0.4s ease forwards;
        }
        .modal-box input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc;
            border-radius: 8px; font-size: 1rem; font-family: 'Inter', sans-serif;
        }
        .btn-login {
            background: var(--denim-blue); color: white; width: 100%; padding: 12px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn-login:hover { background: var(--deep-navy); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    
    <!-- MODAL LOGIN -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <i class="ph-duotone ph-student" style="font-size: 4rem; color: var(--denim-blue);"></i>
            <h2 style="margin-bottom: 5px;">Selamat Datang!</h2>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">Silakan isi data diri untuk mulai belajar.</p>
            <input type="text" id="input-nama" placeholder="Nama Lengkap" required>
            <input type="text" id="input-nisn" placeholder="NISN" required>
            <button id="btn-login" class="btn-login">Mulai Belajar</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo-area">
            <i class="ph-fill ph-code-block logo-icon"></i>
            <div>
                <h1>INFORMATIKA FUN!</h1>
                <p class="tagline">Pembelajaran Interaktif & Menyenangkan</p>
            </div>
        </div>
        <div class="user-profile">
            <div class="user-info">
                <span class="status-dot"></span>
                <span id="user-name" class="user-name">Siswa</span>
            </div>
            <button class="btn-profile" title="Profil Siswa"><i class="ph ph-user-circle"></i></button>
        </div>
    </header>

    <!-- JUDUL HALAMAN KOTAK -->
    <section class="page-title-section">
        <div class="page-title-content">
            <div class="badge-jp"><i class="ph ph-clock"></i> JP: 120 MENIT</div>
            <h2 class="chapter-title">BAB I: Konsep dan Analisis Data Terstruktur</h2>
            <h3 class="meeting-title">Pertemuan 1: Data Terstruktur vs. Tidak Terstruktur</h3>
        </div>
        <i class="ph-duotone ph-database hero-icon"></i>
    </section>

    <!-- MENU NAVIGASI HORIZONTAL -->
    <nav class="nav-container">
        <div id="menu-row" class="menu-row"></div>
    </nav>

    <!-- AREA KONTEN UTAMA -->
    <main class="main-content-area">
        <div id="content-container"></div>
    </main>

    <!-- Script JavaScript (Sekarang menggunakan module untuk Firebase) -->
    <script type="module">
        // 1. IMPORT FIREBASE DARI CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // 2. KONFIGURASI FIREBASE (Dari gambar yang kamu berikan)
        const firebaseConfig = {
            apiKey: "AIzaSyB7bt1JBOXkh81nYk8sVkuFpSmuJ3kOj94", //[cite: 5]
            authDomain: "databasemateriinformatika.firebaseapp.com", //[cite: 5]
            projectId: "databasemateriinformatika", //[cite: 5]
            storageBucket: "databasemateriinformatika.firebasestorage.app", //[cite: 5]
            messagingSenderId: "961327810612", //[cite: 5]
            appId: "1:961327810612:web:48e952f20159a5b932e261" //[cite: 5]
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // LOGIKA LOGIN & USER DATA
        // ==========================================
        const loginModal = document.getElementById('login-modal');
        const btnLogin = document.getElementById('btn-login');
        const userNameDisplay = document.getElementById('user-name');
        
        let currentUser = localStorage.getItem('infoFun_Nama');
        let currentNISN = localStorage.getItem('infoFun_NISN');
        let storageKey = `progress_Informatika_${currentNISN}`;
        let userProgress = {};

        // Cek apakah siswa sudah login sebelumnya
        if (!currentUser || !currentNISN) {
            loginModal.classList.remove('hidden'); // Tampilkan modal
        } else {
            userNameDisplay.textContent = currentUser; // Tampilkan nama
            mulaiAplikasi();
        }

        // Proses Tombol Login
        btnLogin.addEventListener('click', () => {
            const inputNama = document.getElementById('input-nama').value.trim();
            const inputNisn = document.getElementById('input-nisn').value.trim();

            if (inputNama !== "" && inputNisn !== "") {
                // Simpan ke localStorage
                localStorage.setItem('infoFun_Nama', inputNama);
                localStorage.setItem('infoFun_NISN', inputNisn);
                
                currentUser = inputNama;
                currentNISN = inputNisn;
                storageKey = `progress_Informatika_${currentNISN}`;
                
                userNameDisplay.textContent = currentUser;
                loginModal.classList.add('hidden'); // Sembunyikan modal
                mulaiAplikasi(); // Render menu
            } else {
                alert("Harap isi Nama dan NISN dengan lengkap!");
            }
        });


        // ==========================================
        // LOGIKA APLIKASI (Menu & Firebase Save)
        // ==========================================
        const learningMenus = [
            { id: "atp", title: "ATP", icon: "ph-target", type: "read" },
            { id: "asesmen-awal", title: "ASESMEN AWAL", icon: "ph-clipboard-text", type: "task" },
            { id: "pertanyaan-esensial", title: "PERTANYAAN ESENSIAL", icon: "ph-question", type: "read" },
            { id: "eksplorasi-konsep", title: "EKSPLORASI KONSEP", icon: "ph-folders", type: "read" },
            { id: "for-learning", title: "FOR LEARNING", icon: "ph-lightbulb", type: "task" },
            { id: "penerapan-konsep", title: "PENERAPAN KONSEP", icon: "ph-wrench", type: "task" },
            { id: "as-learning", title: "AS LEARNING", icon: "ph-brain", type: "task" }
        ];

        function mulaiAplikasi() {
            userProgress = JSON.parse(localStorage.getItem(storageKey)) || {};
            const menuContainer = document.getElementById("menu-row");
            const contentContainer = document.getElementById("content-container");
            
            menuContainer.innerHTML = "";
            contentContainer.innerHTML = "";

            learningMenus.forEach((menu) => {
                const currentStatus = userProgress[menu.id] || "unstarted";

                // Buat Tab
                const btn = document.createElement("button");
                btn.id = `btn-${menu.id}`;
                btn.className = "tab-button";
                btn.dataset.target = menu.id;
                updateButtonVisuals(btn, menu, currentStatus);

                // Efek Ripple
                btn.addEventListener("click", function(e) { createRipple(e, this); });

                // Buat Konten
                const pane = document.createElement("div");
                pane.id = `pane-${menu.id}`;
                pane.className = "tab-pane";
                let actionButtonText = menu.type === "read" ? "Tandai Selesai Dibaca" : "Kirim Jawaban Tugas";
                
                pane.innerHTML = `
                    <div class="content-card">
                        <i class="ph-duotone ${menu.icon}" style="font-size: 3rem; color: var(--denim-blue); margin-bottom: 12px; display: inline-block;"></i>
                        <h2>${menu.title}</h2>
                        <p style="margin-top: 12px; color: #555;">Ruang konten ini siap diisi dengan materi.</p>
                        <br>
                        <button id="action-${menu.id}" class="btn-action ${currentStatus === 'completed' ? 'success' : ''}">
                            <i class="ph-bold ${currentStatus === 'completed' ? 'ph-check' : 'ph-paper-plane-right'}"></i> 
                            <span class="btn-text">${currentStatus === 'completed' ? 'Selesai Dikerjakan' : actionButtonText}</span>
                        </button>
                    </div>
                `;

                // Logika Klik Menu
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active-tab"));
                    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
                    btn.classList.add("active-tab");
                    document.getElementById(`pane-${menu.id}`).classList.add("active");

                    if ((userProgress[menu.id] || "unstarted") === "unstarted") {
                        saveProgress(menu.id, "progress");
                        updateButtonVisuals(btn, menu, "progress");
                    }
                });

                menuContainer.appendChild(btn);
                contentContainer.appendChild(pane);

                // --- BAGIAN INI UNTUK MENGIRIM DATA KE FIREBASE ---
                const actionBtn = document.getElementById(`action-${menu.id}`);
                actionBtn.addEventListener("click", async function(e) {
                    createRipple(e, this);
                    
                    // Ubah teks sementara jadi loading
                    const btnText = this.querySelector('.btn-text');
                    const originalText = btnText.innerText;
                    btnText.innerText = "Mengirim...";

                    try {
                        // Perintah menyimpan ke Firestore Database
                        await addDoc(collection(db, "pengumpulan_tugas"), {
                            namaSiswa: currentUser,
                            nisnSiswa: currentNISN,
                            menuDikerjakan: menu.title,
                            waktuPengumpulan: serverTimestamp()
                        });

                        // Jika berhasil simpan, ubah tampilan tombol
                        this.classList.add("success");
                        this.innerHTML = `<i class="ph-bold ph-check"></i> <span class="btn-text">Tersimpan di Database!</span>`;
                        
                        saveProgress(menu.id, "completed");
                        updateButtonVisuals(btn, menu, "completed");

                    } catch (error) {
                        console.error("Error menambah dokumen: ", error);
                        alert("Gagal mengirim tugas. Pastikan internet menyala dan database Firebase sudah diatur 'Test Mode'.");
                        btnText.innerText = originalText; // kembalikan teks jika gagal
                    }
                });
            });

            // Otomatis klik menu pertama
            const firstButton = document.getElementById(`btn-${learningMenus[0].id}`);
            if(firstButton) firstButton.click();
        }

        // Fungsi Bantuan Visual (Ripple, dll)
        function createRipple(event, element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            element.appendChild(circle);
        }

        function updateButtonVisuals(btn, menu, status) {
            btn.classList.remove("status-progress", "status-completed");
            let statusIcon = "ph-circle"; 
            if (status === "progress") { btn.classList.add("status-progress"); statusIcon = "ph-spinner-gap ph-spin"; } 
            else if (status === "completed") { btn.classList.add("status-completed"); statusIcon = "ph-check-circle"; }
            btn.innerHTML = `<i class="ph-duotone ${menu.icon} menu-icon"></i> <span class="menu-title">${menu.title}</span> <i class="ph-bold ${statusIcon} status-indicator"></i>`;
        }

        function saveProgress(menuId, status) {
            userProgress[menuId] = status;
            localStorage.setItem(storageKey, JSON.stringify(userProgress));
        }
    </script>
</body>
</html>
